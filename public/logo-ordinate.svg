<svg width="340" height="240" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ordinate logo</title>
  <desc id="desc">Cursive O with top flourish, small x-axis, upward y-axis, colored origin. Transparent background.</desc>
  <defs>
    <style>
      :root {
        color-scheme: light dark;
      }
      .ink {
        stroke: currentColor;
        fill: none;
      }
      .axis {
        stroke: currentColor;
        stroke-width: 3.5;
        stroke-linecap: round;
      }
      .o {
        stroke: currentColor;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .flourish {
        stroke: currentColor;
        stroke-width: 7;
        stroke-linecap: round;
        fill: none;
      }
      .origin {
        fill: #00D1FF;
      }
    </style>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <g transform="translate(50,170)" style="color:#0F1115">
    <line x1="0" y1="50" x2="0" y2="-110" class="axis" marker-end="url(#arrowUp)" />
    <line x1="-28" y1="0" x2="50" y2="0" class="axis" marker-end="url(#arrowRight)" />
    <circle cx="0" cy="0" r="8" class="origin" />
    <g transform="translate(150,-10) skewX(-16)">
      <path class="flourish" d="M -46 -106 C -16 -124 20 -128 50 -112" />
      <path
        class="o"
        d="M -54 -20 C -54 -74, -18 -112, 26 -112 C 80 -112, 110 -66, 102 -12 C 94 36, 56 74, 10 80 C -34 86, -72 48, -70 2 C -68 -40, -46 -62, -22 -60 C 6 -58, 24 -38, 18 -14 C 12 8, -6 22, -20 20 C -34 18, -48 6, -54 -20 Z"
      />
    </g>
  </g>
</svg>
